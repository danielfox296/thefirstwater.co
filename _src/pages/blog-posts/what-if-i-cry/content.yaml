title: "What people ask me about crying"
seo_title: "Is It Normal to Cry During a Sound Bath?"
slug: "what-if-i-cry"
eyebrow: "JOURNAL"
dek: "Almost every time it comes with an apology attached: somebody finds me afterward, tells me they cried, and then explains themselves. Here is what I think is going on."
date: "2026-08-24"
last_updated: "2026-08-24"
author:
  name: "Firstwater"
  role: "Denver"
meta_description: "A Denver facilitator on crying during a sound bath: how often it happens, what the space does when it does, and why people apologize for it afterward."
llms_description: "First-person essay from the Firstwater facilitator on crying during a sound bath. Covers how common it is, what actually happens in the space when someone cries (nobody turns, the hour continues), why people arrive having already decided it would be a failure of composure, and the open door. Written for anyone deciding whether to come to a session about grief, a breakup, or a job loss."
tags: [journal, practice]
sections:
  - type: prose
    body: |
      Somebody catches me while I'm putting bowls back in cases and tells me
      they cried, and then keeps talking. They tell me it's been a long month,
      or that they're not usually like this, or that they don't know where it
      came from.

      I've started noticing the second half more than the first, because the
      crying is ordinary and the explaining is the part worth looking at.

  - type: subhead
    text: "Is it normal to cry during a sound bath?"

  - type: prose
    body: |
      Yes, and often enough that I stopped registering it as an event years
      ago. From where I sit I usually can't tell it's happening at all, and
      when I can, it doesn't change anything I do.

      The FAQ on this site answers the question in one line and I won't
      improve on it: if you find yourself crying, it's welcome here, and
      nobody will make it a moment.

  - type: subhead
    text: "What the space actually does"

  - type: prose
    body: |
      Nothing. That's the answer, and it's the whole reason the question is
      worth a page.

      Nobody turns to look or reaches over, no one hands you anything or asks
      if you're all right, and I keep playing. The hour continues exactly as it
      would have, which means the thing you were afraid of, becoming the event
      in the space, doesn't have a way to occur. Thirty people lying in
      a dark space with their eyes closed are the best possible company for
      this, because they are all busy.

      If you need to get up, the door is beside you and nobody will make it a
      moment. You can come back in. You can also not come back in, and I'll
      see you next month.

  - type: pullquote
    text: "The crying is ordinary, and the explaining is the part worth looking at."

  - type: subhead
    text: "Why people apologize for it"

  - type: prose
    body: |
      People arrive having already decided that crying in front of strangers is
      a failure of composure. Somebody taught them that, probably early, and
      they've been carrying the ruling ever since without ever going back to
      check who made it or on what grounds.

      I understand the reflex. I have it too, in most places I'm in. What I'd
      say is that you're applying a rule from one setting to a setting that was
      built differently. In a meeting, composure gets you something. On a mat
      in the dark for an hour, with no one asking you anything, you're keeping
      your composure for nobody.

  - type: subhead
    text: "What I think is happening"

  - type: prose
    body: |
      I hold this as my own view rather than as a fact about you. Most people
      spend most of their week managing what they're carrying well enough to
      keep going, and that management takes constant low effort that they stop
      noticing. Take away the tasks, the talking and the light for an hour, and
      there's nothing left to spend that effort on, so you notice what you were
      managing. Sometimes you notice it by falling asleep, and sometimes by
      crying, and both are the same thing from where I sit.

      Each night is built around something worth putting down. That's the
      offer, stated plainly, and putting a thing down occasionally looks like
      this from the outside.

      Some of the sessions are built directly on top of this: the ones about
      [grief](../sessions/grief/), about [a breakup](../sessions/healing-from-breakups/),
      about [losing a job](../sessions/laid-off/). People arrive at those already
      knowing what they came to put down, which makes the question of whether
      they'll cry a strange one to be asking at the door.

  - type: prose
    body: |
      Come next month. If it happens, it happens, and the last sound will still
      be in the space when you sit up, same as everyone else.

  - type: cta
    variant: "default"
    headline: "Come lie down"
    body: "Sessions run in Denver. You get the time, the space, and a floor, and what you do with the hour is yours."
    link: "../sessions/"
