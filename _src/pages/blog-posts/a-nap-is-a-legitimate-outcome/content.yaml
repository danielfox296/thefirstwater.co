title: "A nap is a legitimate outcome"
seo_title: "Is It OK to Fall Asleep During a Sound Bath?"
slug: "a-nap-is-a-legitimate-outcome"
eyebrow: "JOURNAL"
dek: "People go under in these sessions all the time, and then ask me afterward whether they missed the point. Here is what the hour is actually for."
