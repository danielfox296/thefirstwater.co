sections:
  - type: prose
    body: |
      This is a session for people carrying a death, in a smaller space with fewer
      seats and more time held at the quiet end of the night. You won't be asked
      to share, to speak, or to be anywhere but on the floor.

  - type: prose
    body: |
      I take more care with this one than with anything else on this site. If
      what you're carrying is the end of a relationship rather than a
      death, [Healing from Breakups](../healing-from-breakups/) is built for that.
      [Write to me](../../contact/) and check the box, and you'll hear when the
      next one goes up.

      [All sessions](../../sessions/)
