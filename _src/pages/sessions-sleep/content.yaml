  - type: prose
    body: |
      This is a recording for the end of the day, made with the same care as the
      live sessions: bass you feel in your chest, a shape built the way a song is
      built, and an ending made to be slept through.

  - type: prose
    body: |
      It comes free to people on the email list, and it comes to them first. You
      listen to this one at home, in the dark, at the end of your own day.
      [Write to me](../../contact/) and check the box, and I send it to you.

      [All sessions](../../sessions/)
